[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmk-toolbox"
version = "0.3.4"
description = "A flashing/debug utility for devices running QMK Firmware"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyserial", "pyusb"]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
